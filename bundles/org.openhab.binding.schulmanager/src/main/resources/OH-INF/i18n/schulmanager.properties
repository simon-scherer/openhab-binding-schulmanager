# add-on

addon.schulmanager.name = Schulmanager Online Binding
addon.schulmanager.description = This is the binding for Schulmanager Online, a school platform used in Germany. It provides the timetable with substitutions, exams, school events, homework and parent letters.

# thing types

thing-type.schulmanager.account.label = Schulmanager Account
thing-type.schulmanager.account.description = Login to Schulmanager Online (parent or student account, also with several schools)
thing-type.schulmanager.account.channel.lettersUnread.label = Unread Parent Letters
thing-type.schulmanager.account.channel.lettersList.label = Unread Parent Letters (Titles)
thing-type.schulmanager.account.channel.lettersWidget.label = Parent Letters for Widget
thing-type.schulmanager.account.channel.lettersWidget.description = Latest parent letters including text (JSON) for the widget sm_elternbriefe. Read only, never marks a letter as read.
thing-type.schulmanager.account.channel.messagesUnread.label = Unread Messages
thing-type.schulmanager.account.channel.lastUpdate.label = Last Update
thing-type.schulmanager.student.label = Schulmanager Student
thing-type.schulmanager.student.description = Timetable, exams, school events and homework of one child

# thing types config

thing-type.config.schulmanager.account.group.login.label = Login
thing-type.config.schulmanager.account.group.data.label = Data
thing-type.config.schulmanager.account.username.label = E-Mail / Username
thing-type.config.schulmanager.account.username.description = Credentials as used in the Schulmanager app
thing-type.config.schulmanager.account.password.label = Password
thing-type.config.schulmanager.account.twoFactorCode.label = Two-Factor Code
thing-type.config.schulmanager.account.twoFactorCode.description = Only for accounts with two-factor login and only once: enter the current code of the authenticator app (or from the e-mail) when the bridge asks for it. Like the app, the binding then remembers a device and no longer needs the code.
thing-type.config.schulmanager.account.refreshInterval.label = Refresh Interval
thing-type.config.schulmanager.account.refreshInterval.description = Minutes between two updates (at least 15)
thing-type.config.schulmanager.account.scheduleWeeks.label = Timetable Weeks
thing-type.config.schulmanager.account.scheduleWeeks.description = Current week plus following weeks (1-3); on weekends one more week is loaded
thing-type.config.schulmanager.account.teacherDisplay.label = Show Teachers As
thing-type.config.schulmanager.account.teacherDisplay.description = Display in the timetable and the text channels. The details always show the full name with abbreviation (if the school provides names).
thing-type.config.schulmanager.account.teacherDisplay.option.lastname = Last name
thing-type.config.schulmanager.account.teacherDisplay.option.name = First and last name
thing-type.config.schulmanager.account.teacherDisplay.option.abbreviation = Abbreviation
thing-type.config.schulmanager.account.subjectDisplay.label = Show Subjects As
thing-type.config.schulmanager.account.subjectDisplay.description = Display in the timetable and the text channels. The details always show the full subject name.
thing-type.config.schulmanager.account.subjectDisplay.option.name = Subject name (e.g. Geographie)
thing-type.config.schulmanager.account.subjectDisplay.option.abbreviation = Abbreviation (e.g. Geo)
thing-type.config.schulmanager.account.subjectNames.label = Custom Subject Names
thing-type.config.schulmanager.account.subjectNames.description = Custom display per subject, e.g. "Ev=Religion, Swd=Sport, Sw=Sport". The key is the abbreviation or the official subject name. Applies to timetable, exams and homework and overrides "Show Subjects As". The details still show the official name.
thing-type.config.schulmanager.account.lettersLoadUnread.label = Load Text of Unread Letters
thing-type.config.schulmanager.account.lettersLoadUnread.description = Also loads the text of letters that are still unread. Off as long as it is not confirmed that loading does not mark a letter as read in Schulmanager. Read letters are always loaded.
thing-type.config.schulmanager.account.examDaysAhead.label = Exam Preview
thing-type.config.schulmanager.account.examDaysAhead.description = Days ahead for exams, tests and school events
thing-type.config.schulmanager.student.studentId.label = Student ID
thing-type.config.schulmanager.student.studentId.description = Schulmanager ID of the child; listed in the properties (students) of the account bridge

