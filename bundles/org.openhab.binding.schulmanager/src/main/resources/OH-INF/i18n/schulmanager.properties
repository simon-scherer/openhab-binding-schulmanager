# thing status descriptions

offline.conf-error.credentials-missing = Configure e-mail (username) and password.
offline.conf-error.two-factor-totp = Two-factor login: enter the current code of the authenticator app as twoFactorCode of the bridge and save (the code is only valid for a short time).
offline.conf-error.two-factor-email = Two-factor login: enter the code sent by e-mail as twoFactorCode of the bridge and save (the code is only valid for a short time).
offline.conf-error.student-id-missing = studentId is missing (listed in the properties of the account bridge).
offline.conf-error.bridge-missing = The thing needs a Schulmanager account bridge.
offline.conf-error.student-unknown = studentId {0} does not belong to this account (available: {1}).
