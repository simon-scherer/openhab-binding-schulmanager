# add-on

addon.schulmanager.name = Schulmanager Online Binding
addon.schulmanager.description = Binding für Schulmanager Online: Stundenplan mit Vertretungen, Arbeiten, Schultermine, Hausaufgaben und Elternbriefe.

# thing types

thing-type.schulmanager.account.label = Schulmanager-Konto
thing-type.schulmanager.account.description = Anmeldung bei Schulmanager Online (Eltern- oder Schülerkonto, auch an mehreren Schulen)
thing-type.schulmanager.account.channel.lettersUnread.label = Ungelesene Elternbriefe
thing-type.schulmanager.account.channel.lettersList.label = Ungelesene Elternbriefe (Titel)
thing-type.schulmanager.account.channel.lettersWidget.label = Elternbriefe für Widget
thing-type.schulmanager.account.channel.lettersWidget.description = Letzte Elternbriefe mit Text (JSON) für das Widget sm_elternbriefe. Liest nur, markiert nichts als gelesen.
thing-type.schulmanager.account.channel.messagesUnread.label = Ungelesene Nachrichten
thing-type.schulmanager.account.channel.lastUpdate.label = Letzte Aktualisierung
thing-type.schulmanager.student.label = Schulmanager-Kind
thing-type.schulmanager.student.description = Stundenplan, Arbeiten und Hausaufgaben eines Kindes

# thing types config

thing-type.config.schulmanager.account.group.login.label = Anmeldung
thing-type.config.schulmanager.account.group.data.label = Daten
thing-type.config.schulmanager.account.username.label = E-Mail / Benutzername
thing-type.config.schulmanager.account.username.description = Zugangsdaten wie in der Schulmanager-App
thing-type.config.schulmanager.account.password.label = Passwort
thing-type.config.schulmanager.account.twoFactorCode.label = Zwei-Faktor-Code
thing-type.config.schulmanager.account.twoFactorCode.description = Nur bei Konten mit Zwei-Faktor-Anmeldung und nur einmalig: aktuellen Code der Authenticator-App (oder aus der E-Mail) eintragen, sobald die Bridge danach fragt. Das Binding merkt sich danach wie die App ein Gerät; der Code wird nicht mehr gebraucht.
thing-type.config.schulmanager.account.refreshInterval.label = Aktualisierungsintervall
thing-type.config.schulmanager.account.refreshInterval.description = Minuten zwischen zwei Abrufen (mindestens 15)
thing-type.config.schulmanager.account.scheduleWeeks.label = Wochen Stundenplan
thing-type.config.schulmanager.account.scheduleWeeks.description = Aktuelle Woche plus Folgewochen (1-3); am Wochenende wird eine Woche mehr geladen
thing-type.config.schulmanager.account.teacherDisplay.label = Lehrkräfte anzeigen als
thing-type.config.schulmanager.account.teacherDisplay.description = Darstellung im Stundenplan und in den Text-Channels. In den Details per Antippen steht immer der volle Name mit Kürzel (sofern die Schule Namen übermittelt).
thing-type.config.schulmanager.account.teacherDisplay.option.lastname = Nachname
thing-type.config.schulmanager.account.teacherDisplay.option.name = Vor- und Nachname
thing-type.config.schulmanager.account.teacherDisplay.option.abbreviation = Kürzel
thing-type.config.schulmanager.account.subjectDisplay.label = Fächer anzeigen als
thing-type.config.schulmanager.account.subjectDisplay.description = Darstellung im Stundenplan und in den Text-Channels. In den Details per Antippen steht immer der volle Fachname.
thing-type.config.schulmanager.account.subjectDisplay.option.name = Fachname (z. B. Geographie)
thing-type.config.schulmanager.account.subjectDisplay.option.abbreviation = Kürzel (z. B. Geo)
thing-type.config.schulmanager.account.subjectNames.label = Eigene Fachnamen
thing-type.config.schulmanager.account.subjectNames.description = Eigene Anzeige je Fach, z. B. "Ev=Religion, Swd=Sport, Sw=Sport". Schlüssel ist das Kürzel oder der offizielle Fachname. Gilt für Stundenplan, Arbeiten und Hausaufgaben; überschreibt "Fächer anzeigen als". In den Details per Antippen steht weiterhin der offizielle Name.
thing-type.config.schulmanager.account.lettersLoadUnread.label = Text ungelesener Elternbriefe laden
thing-type.config.schulmanager.account.lettersLoadUnread.description = Lädt auch den Text noch ungelesener Briefe. Aus, solange nicht geprüft ist, dass der Abruf einen Brief in Schulmanager nicht als gelesen markiert. Gelesene Briefe werden immer geladen.
thing-type.config.schulmanager.account.examDaysAhead.label = Arbeiten-Vorschau
thing-type.config.schulmanager.account.examDaysAhead.description = Tage im Voraus für Arbeiten, Tests und Schultermine
thing-type.config.schulmanager.student.studentId.label = Schüler-ID
thing-type.config.schulmanager.student.studentId.description = Schulmanager-ID des Kindes; steht in den Eigenschaften (students) der Konto-Bridge

